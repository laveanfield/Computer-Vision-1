[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-project-1"
version = "0.1.0"
description = "Computer Vision project 1: color/gray image representation, spatial filtering and geometric transformations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
